name: Build Grabbr for macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15

    steps:
      - name: Checkout Grabbr
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Grabbr for Apple Silicon
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --arm64 --publish never

      - name: Ad-hoc sign Grabbr
        run: codesign --force --deep --sign - release/mac-arm64/Grabbr.app

      - name: Verify Grabbr
        run: codesign --verify --deep --strict --verbose=2 release/mac-arm64/Grabbr.app

      - name: Package Grabbr
        run: ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Grabbr.app Grabbr-macOS-arm64.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Grabbr-macOS-arm64
          path: Grabbr-macOS-arm64.zip
